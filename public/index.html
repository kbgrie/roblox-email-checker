<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roblox Email Checker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:radial-gradient(circle at 20% 20%,#1e1b4b,#0f0f23 60%);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;color:#e2e8f0
  }
  .card{
    background:rgba(30,30,46,.9);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:32px;max-width:520px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.5)
  }
  h1{
    font-size:24px;margin-bottom:8px;
    background:linear-gradient(90deg,#a78bfa,#60a5fa);
    -webkit-background-clip:text;background-clip:text;color:transparent
  }
  .subtitle{color:#94a3b8;font-size:14px;margin-bottom:20px}
  .warn{
    background:rgba(251,191,36,.1);border-left:3px solid #fbbf24;
    padding:10px 14px;border-radius:8px;font-size:13px;color:#fbbf24;
    margin-bottom:20px;line-height:1.5
  }
  label{font-size:13px;color:#94a3b8;display:block;margin-bottom:8px}
  textarea{
    width:100%;min-height:110px;background:#0f172a;
    border:1px solid rgba(255,255,255,.1);border-radius:10px;
    padding:12px;color:#e2e8f0;font-family:'Courier New',monospace;
    font-size:13px;resize:vertical;word-break:break-all
  }
  textarea:focus{outline:none;border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
  button{
    width:100%;margin-top:14px;padding:12px;
    background:linear-gradient(90deg,#7c3aed,#3b82f6);
    border:none;border-radius:10px;color:#fff;
    font-weight:600;font-size:15px;cursor:pointer;transition:opacity .2s
  }
  button:hover:not(:disabled){opacity:.9}
  button:disabled{opacity:.5;cursor:not-allowed}
  .result{
    margin-top:24px;padding:18px;border-radius:12px;background:#0f172a;
    border:1px solid rgba(255,255,255,.1);display:none
  }
  .result.show{display:block}
  .row{
    display:flex;justify-content:space-between;padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;gap:12px
  }
  .row:last-child{border:none}
  .row span:first-child{color:#94a3b8;flex-shrink:0}
  .row span:last-child{text-align:right;word-break:break-all}
  .yes{color:#34d399;font-weight:600}
  .no{color:#f87171;font-weight:600}
  .error{color:#f87171}
  .spinner{
    display:inline-block;width:14px;height:14px;
    border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:8px
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>🛡️ Roblox Email Checker</h1>
  <p class="subtitle">Kiểm tra tài khoản Roblox có email hay chưa qua cookie</p>

  <div class="warn">
    ⚠️ Chỉ dùng với tài khoản của chính bạn. Cookie = quyền truy cập tài khoản, đừng chia sẻ cho ai.
  </div>

  <label for="cookie">Dán cookie .ROBLOSECURITY</label>
  <textarea id="cookie" placeholder="Dán cookie vào đây (có/không có tiền tố .ROBLOSECURITY= đều được)"></textarea>
  <button id="btn" onclick="check()">Kiểm tra</button>

  <div class="result" id="result"></div>
</div>

<script>
async function check() {
  const btn = document.getElementById('btn');
  const result = document.getElementById('result');
  const cookie = document.getElementById('cookie').value.trim();

  result.className = 'result show';
  if (!cookie) {
    result.innerHTML = '<div class="error">Vui lòng nhập cookie.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Đang kiểm tra...';
  result.innerHTML = '';

  try {
    const res = await fetch('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie })
    });
    const data = await res.json();

    if (!data.success) {
      result.innerHTML = `<div class="error">❌ ${escapeHtml(data.error)}</div>`;
      return;
    }

    const { user, email } = data;
    let emailStatus;
    if (!email.hasEmail) emailStatus = '<span class="no">Không có email</span>';
    else if (email.verified) emailStatus = '<span class="yes">Có email (đã xác minh)</span>';
    else emailStatus = '<span class="yes">Có email (chưa xác minh)</span>';

    result.innerHTML = `
      <div class="row"><span>Username</span><span>${escapeHtml(user.name)}</span></div>
      <div class="row"><span>Display Name</span><span>${escapeHtml(user.displayName)}</span></div>
      <div class="row"><span>User ID</span><span>${user.id}</span></div>
      <div class="row"><span>Email</span><span>${emailStatus}</span></div>
      ${email.hasEmail ? `<div class="row"><span>Địa chỉ</span><span>${escapeHtml(email.email)}</span></div>` : ''}
    `;
  } catch (e) {
    result.innerHTML = `<div class="error">❌ Lỗi kết nối: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Kiểm tra';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
</script>
</body>
</html>
